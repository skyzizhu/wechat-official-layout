# ====================================================================
# Radiant Maxwell - 微信排版编辑器 CentOS Nginx 配置文件
# 部署路径建议：/etc/nginx/conf.d/radiant-maxwell.conf
# ====================================================================

server {
    listen 80;
    server_name your-domain.com; # 替换为您的域名或服务器公网 IP

    # 静态资源根目录（对应构建后的 out/ 目录）
    root /usr/share/nginx/html/radiant-maxwell;
    index index.html index.htm;

    # 启用 Gzip 高效压缩（提高首屏加载速度）
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # HTML 与预取数据禁止缓存：确保发版后浏览器立即拿到引用新 JS/CSS 的页面
    location ~* \.(?:html|txt)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Next.js 静态静态构建 Hash 资源长久缓存（1年）
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 静态图片/字体等媒体资源缓存（30天）
    location ~* \.(?:ico|png|jpg|jpeg|gif|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # 单页应用路由回退处理
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 错误页面定义
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
